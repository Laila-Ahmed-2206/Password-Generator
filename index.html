<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app">
    <section class="password-card">
      <div class="header">
        <p class="eyebrow">SECURE PASSWORD TOOL</p>
        <h1>Password Generator</h1>
        <p class="description"> Create a strong random password for your accounts. </p>
      </div>

      <!-- PASS OUTPUT -->
      <div class="password-output">
        <input type="text" id="password" placeholder="Your password will appear here" readonly/>
        <button id="copyBtn" class="icon-button" title="Copy password"> Copy </button>
      </div>
      <p id="copyMessage" class="copy-message"></p>

      <!-- Password strength -->
      <div class="strength-section">
        <div class="strength-info">
          <span> Password strength </span>
          <strong id="strengthText"> Strong </strong>
        </div>
        <div class="strength-bar">
          <div id="strengthFill"></div>
        </div>
      </div>

      <!-- Length -->
      <div class="setting">
        <div class="setting-header">
          <label for="lengthSlider"> Password length </label>
          <span id="lengthValue"> 16 </span>
        </div>
        <input type="range" id="lengthSlider" min="4" max="40" value="16"/>
        <div class="range-labels">
          <span> 4 </span>
          <span> 40 </span>
        </div>
      </div>

      <!-- Character options -->
      <div class="options">
        <label class="option">
          <div>
            <strong> Uppercase letters </strong>
            <span> A-Z </span>
          </div>
          <input type="checkbox" id="uppercase" checked/>
          <span class="checkbox-ui"></span>
        </label>
        <label class="option">
          <div>
            <strong> Lowercase letters </strong>
            <span> a-z </span>
          </div>
          <input type="checkbox" id="lowercase" checked/>
          <span class="checkbox-ui"></span>
        </label>
        <label class="option">
          <div>
            <strong> Numbers </strong>
            <span> 0-9 </span>
          </div>
          <input type="checkbox" id="numbers" checked/>
          <span class="checkbox-ui"></span>
        </label>
        <label class="option">
          <div>
            <strong> Symbols </strong>
            <span> !@#$% </span>
          </div>
          <input type="checkbox" id="symbols" checked/>
          <span class="checkbox-ui"></span>
        </label>
      </div>

      <!-- Error -->
      <p id="errorMessage" class="error-message"></p>

      <!-- Generate -->
      <button id="generateBtn" class="generate-button"> Generate Password </button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
